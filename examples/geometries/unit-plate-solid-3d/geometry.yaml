schema_version: "1.0"
dimension: 3
units: m
source:
  kind: primitives
  primitives:
    - id: domain
      shape: box
      origin: [0.0, 0.0, 0.0]
      size: [1.0, 1.0, 0.1]
regions:
  - name: domain
    dimension: 3
    selector: {kind: object, reference: domain}
  - name: x_min
    dimension: 2
    selector: {kind: bounding_box, bounds: [-1.0e-8, -1.0e-8, -1.0e-8, 1.0e-8, 1.00000001, 0.10000001]}
  - name: x_max
    dimension: 2
    selector: {kind: bounding_box, bounds: [0.99999999, -1.0e-8, -1.0e-8, 1.00000001, 1.00000001, 0.10000001]}
  - name: y_min
    dimension: 2
    selector: {kind: bounding_box, bounds: [-1.0e-8, -1.0e-8, -1.0e-8, 1.00000001, 1.0e-8, 0.10000001]}
  - name: y_max
    dimension: 2
    selector: {kind: bounding_box, bounds: [-1.0e-8, 0.99999999, -1.0e-8, 1.00000001, 1.00000001, 0.10000001]}
  - name: z_min
    dimension: 2
    selector: {kind: bounding_box, bounds: [-1.0e-8, -1.0e-8, -1.0e-8, 1.00000001, 1.00000001, 1.0e-8]}
  - name: z_max
    dimension: 2
    selector: {kind: bounding_box, bounds: [-1.0e-8, -1.0e-8, 0.09999999, 1.00000001, 1.00000001, 0.10000001]}
mesh:
  cell_type: tetrahedron
  order: 1
  global_size: 0.025
  refinements: []
  quality:
    minimum_scaled_jacobian: 0.0
    maximum_elements: 2000000
metadata:
  id: unit-plate-solid-3d
  title: Unit square plate solid
  description: Unit square plate represented as a solid with thickness 0.1.
