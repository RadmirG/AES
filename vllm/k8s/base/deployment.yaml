apiVersion: apps/v1
kind: Deployment
metadata:
  name: aes-vllm
  labels:
    app.kubernetes.io/name: aes-vllm
    app.kubernetes.io/component: model-serving
    app.kubernetes.io/part-of: aes
    gpu-cleaner: allow-gpu-idle
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 3600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aes-vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aes-vllm
        app.kubernetes.io/component: model-serving
        app.kubernetes.io/part-of: aes
        gpu-cleaner: allow-gpu-idle
    spec:
      serviceAccountName: aes-vllm
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: normal
      terminationGracePeriodSeconds: 120
      nodeSelector:
        gpu: a100
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.26.0
          imagePullPolicy: IfNotPresent
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --model
            - $(VLLM_MODEL)
            - --served-model-name
            - $(VLLM_SERVED_MODEL_NAME)
            - --max-model-len
            - $(VLLM_MAX_MODEL_LEN)
            - --tensor-parallel-size
            - $(VLLM_TENSOR_PARALLEL_SIZE)
            - --gpu-memory-utilization
            - $(VLLM_GPU_MEMORY_UTILIZATION)
            - --api-key
            - $(VLLM_API_KEY)
            - --generation-config
            - vllm
            - --enable-prefix-caching
          envFrom:
            - configMapRef:
                name: aes-vllm-config
            - secretRef:
                name: aes-vllm-secrets
            - secretRef:
                name: aes-huggingface
                optional: true
          env:
            - name: HF_HOME
              value: /model-cache/huggingface
            - name: VLLM_CACHE_ROOT
              value: /model-cache/vllm
            - name: XDG_CACHE_HOME
              value: /model-cache
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 32Gi
              ephemeral-storage: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 64Gi
              ephemeral-storage: 16Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
            - name: shared-memory
              mountPath: /dev/shm
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: aes-vllm-cache
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        - name: temporary-files
          emptyDir:
            sizeLimit: 8Gi
